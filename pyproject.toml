[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-benchmarking"
version = "0.1.0"
description = "Graph database cloud benchmarking suite"
requires-python = ">=3.10"
dependencies = [
    "neo4j==5.25.0",
    "python-dotenv==1.0.1",
    "requests==2.32.3",
    "numpy==2.1.3",
    "pandas==2.2.3",
    "rich==13.9.4",
    "PyYAML==6.0.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["benchmark*"]
